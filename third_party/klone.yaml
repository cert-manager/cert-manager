# Clone folders from third_party repos and forks.
# More info can be found here: https://github.com/cert-manager/klone
#
# - acme
#   We vendor just the acme package, from a cert-manager fork of
#   golang.org/x/crypto. The fork adds ACME Renewal Information (ARI) and
#   RetryAfter fields, which upstream does not have yet.
#   See https://github.com/golang/go/issues/60958 and
#   https://github.com/golang/go/issues/74454
targets:
  forked:
    - folder_name: acme
      repo_url: https://github.com/cert-manager/crypto
      repo_ref: master
      repo_hash: bac6bdb88ef45936a623eebb3001b4814aa03b5b
      repo_path: acme
