{{- if and .Values.prometheus.enabled (not .Values.prometheus.podmonitor.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "cert-manager.fullname" . }}
  namespace: {{ include "cert-manager.namespace" . }}
{{- with .Values.serviceAnnotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
  labels:
    {{- $labels := mergeOverwrite
          (include "cert-manager.controllerLabels" . | fromYaml)
          (.Values.serviceLabels | default dict)
          (dict "app.kubernetes.io/name" (include "cert-manager.name" .)
                "app.kubernetes.io/instance" .Release.Name
                "app.kubernetes.io/component" "controller")
    -}}
    {{- toYaml $labels | nindent 4 }}
spec:
  type: ClusterIP
  {{- if .Values.serviceIPFamilyPolicy }}
  ipFamilyPolicy: {{ .Values.serviceIPFamilyPolicy }}
  {{- end }}
  {{- if .Values.serviceIPFamilies }}
  ipFamilies: {{ .Values.serviceIPFamilies | toYaml | nindent 2 }}
  {{- end }}
  ports:
  - protocol: TCP
    port: 9402
    name: http-metrics
  selector:
    app.kubernetes.io/name: {{ include "cert-manager.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: "controller"
{{- end }}
