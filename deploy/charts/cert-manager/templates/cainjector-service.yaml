{{- if .Values.cainjector.enabled }}
{{- if and .Values.prometheus.enabled (not .Values.prometheus.podmonitor.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "cainjector.fullname" . }}
  namespace: {{ include "cert-manager.namespace" . }}
{{- with .Values.cainjector.serviceAnnotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
  labels:
    {{- $labels := mergeOverwrite
          (include "cainjector.componentLabels" . | fromYaml)
          (.Values.cainjector.serviceLabels | default dict)
          (dict "app.kubernetes.io/name" (include "cainjector.name" .)
                "app.kubernetes.io/instance" .Release.Name
                "app.kubernetes.io/component" "cainjector")
    -}}
    {{- toYaml $labels | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 9402
    name: http-metrics
  selector:
    app.kubernetes.io/name: {{ include "cainjector.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: "cainjector"
{{- end }}
{{- end }}
